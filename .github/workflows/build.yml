name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build relay.csproj -c Release

      - name: Publish self-contained build
        run: dotnet publish relay.csproj -p:PublishProfile=SingleFile -o out/self-contained

      - name: Publish framework-dependent build
        run: dotnet publish relay.csproj -p:PublishProfile=SingleFileRequiresDotNet -o out/requires-dotnet

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/self-contained/Relay.exe dist/Relay.exe
          Copy-Item out/requires-dotnet/Relay.exe dist/Relay-requires-dotnet.exe

      - uses: actions/upload-artifact@v4
        with:
          name: relay-windows-x64
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: relay-windows-x64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
